name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup npm
        run: npm install
      - name: Test
        run: |
          npm test
      - name: Build
        run: |
          npm run build
      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: drylungs
          path: public
